name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Print branch name
        run: echo "${{ github.ref }}"

      - name: Print changed files
        run: git diff --name-only HEAD~1

  build:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install HTML Validator
        run: npm install -g html-validator-cli

      - name: Validate HTML
        run: html-validator --file index.html

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify application title
        run: grep "Todo App" index.html

deploy:
  needs: test
  runs-on: ubuntu-latest

  if: github.ref == 'refs/heads/main'

  environment:
    name: staging

  steps:
    - name: Deploy
      run: echo "Deploying with token: ${{ secrets.DEPLOY_TOKEN }}"

        